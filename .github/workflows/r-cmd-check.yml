name: R-CMD-check
on:
  workflow_dispatch:
  push:
    paths: ["om/R/**"]

permissions:
  contents: write

jobs:
  simple-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: protected-species-management/operating-model
          path: om

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: om
          packages: deps::om
          extra-packages: |
            any::TMB

      - name: Simple check
        uses: r-lib/actions/check-r-package@v2

